plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Supply-chain hardening: lock the fully-resolved dependency graph
// (direct + transitive) to exact versions+hashes. Run
// `./gradlew :app:dependencies --write-locks` after any intentional
// dependency change to refresh app/gradle.lockfile.
//
// CORRECTED: this comment previously claimed CI already runs with
// `--locked`, enforcing that an unreviewed transitive bump fails the
// build. That was not true - .github/workflows/android.yml invokes plain
// `gradle --no-daemon :app:assembleDebug` / `:app:testDebugUnitTest`, with
// no `--locked` flag anywhere, so locking is NOT currently enforced by CI.
// This is deliberate for now, not an oversight introduced here: the
// lockfile this would enforce against does not exist yet either (see
// docs/security/SUPPLY_CHAIN.md - it requires the one-time
// bootstrap-supply-chain.yml workflow to be run and its output PR merged
// first). Passing `--locked` before that file exists would hard-fail
// every build immediately. Once the lockfile is merged, add `--locked` to
// both gradle invocations in android.yml to make this comment true.
dependencyLocking {
    lockAllConfigurations()
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace 'com.securekeyboard.app'
    compileSdk 34

    defaultConfig {
        // Optional release-time signing-certificate pin. Leave empty for local/dev builds.
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"\""
        // Changed from com.securekeyboard.app -> com.securekeyboard.pro so
        // this build installs as a SEPARATE app next to any older version
        // already on the device, instead of overwriting/removing it.
        // Android treats applicationId as the unique app identity; two
        // different IDs can be installed side by side even though the
        // internal Kotlin package (namespace, above) is unchanged.
        applicationId "com.securekeyboard.pro"
        minSdk 24
        targetSdk 34
        versionCode 40
        versionName "4.0"
    }

    signingConfigs {
        release {
            // Release signing is opt-in via environment variables / CI
            // secrets (RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
            // RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). If they are not
            // set, this signingConfig is left incomplete on purpose:
            // Gradle will then produce an UNSIGNED release build rather
            // than silently falling back to a shared/public debug
            // keystore. Anyone doing a real (non-test) deployment must
            // supply their own private keystore. See README.md.
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    def expectedCert = project.findProperty("secureKeyboardExpectedCertSha256")
    if (expectedCert != null && expectedCert.toString().trim()) {
        buildTypes.each { type ->
            type.buildConfigField "String", "EXPECTED_CERT_SHA256", "\"${expectedCert.toString().trim()}\""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxParallelForks = 1 // Argon2id tests are memory-heavy; avoid OOM from parallel forks.
            }
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Pure-Java Argon2id implementation (no native/.so binaries needed,
    // so it works on every Android ABI without extra NDK setup). Used to
    // replace PBKDF2: Argon2id costs real memory per guess, not just CPU
    // time, which makes GPU/ASIC brute-forcing far more expensive than
    // PBKDF2 at an equivalent "iteration count".
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // V21 adversarial/instrumented crypto tests (require an emulator/device,
    // exercise real Keystore-backed paths).
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'

    // Fast JVM-level unit tests: run in seconds with no emulator, so they
    // execute on every push/PR rather than only when the emulator job runs.
    // Robolectric is needed because CryptoEngine calls android.util.Base64,
    // which throws "not mocked" under plain JUnit without it.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    // Intentionally NO networking libraries (no OkHttp, Retrofit, etc).
    // This app never requests android.permission.INTERNET in the manifest,
    // so the OS itself blocks any network access at install time -
    // no code-level promise is needed, it's enforced by the platform.
}
