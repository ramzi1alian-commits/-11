name: Dependency Verification Bootstrap (review before merge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate dependency verification metadata
        run: |
          gradle --no-daemon --stacktrace \
            -Dorg.gradle.dependency.verification=strict \
            --write-verification-metadata sha256 \
            :app:dependencies

      - name: Upload generated verification metadata for manual review
        uses: actions/upload-artifact@v4
        with:
          name: gradle-verification-metadata-${{ github.sha }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 14
