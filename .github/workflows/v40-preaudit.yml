name: SecureKeyboard V43 Pre-Audit

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  security-build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Check supply-chain verification inputs
        id: supply
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradle/verification-metadata.xml ] && [ -f app/gradle.lockfile ]; then
            echo "Dependency verification inputs found: building with strict verification."
            echo "flag=-Dorg.gradle.dependency.verification=strict" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Dependency verification OFF::gradle/verification-metadata.xml and/or app/gradle.lockfile are missing, so this build runs WITHOUT checksum verification. Run the dependency-verification-bootstrap workflow, review its output line by line and commit it; this workflow then switches to strict automatically."
            echo "flag=-Dorg.gradle.dependency.verification=off" >> "$GITHUB_OUTPUT"
          fi

      - name: Static security audits
        run: |
          chmod +x scripts/*.sh
          ./scripts/security_audit.sh
          ./scripts/security_hardening_audit.sh
          ./scripts/crypto_key_management_audit.sh
          ./scripts/v40_audit.sh

      - name: JVM unit tests
        run: gradle --no-daemon --stacktrace ${{ steps.supply.outputs.flag }} :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace ${{ steps.supply.outputs.flag }} :app:assembleDebug

      - name: Assemble release APK (unsigned is expected unless CI signing secrets are configured)
        run: gradle --no-daemon --stacktrace ${{ steps.supply.outputs.flag }} :app:assembleRelease

      - name: APK integrity report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \; | tee audit-artifacts/APK_SHA256.txt
          cp -f docs/security/V40_PRE_AUDIT_TEST_REPORT.md audit-artifacts/ 2>/dev/null || true
          cp -f docs/security/V40_SECURITY_AUDIT_READINESS.md audit-artifacts/ 2>/dev/null || true
          cp -f docs/security/V40_INTEGRITY_MANIFEST.sha256 audit-artifacts/ 2>/dev/null || true

      - name: Upload APKs and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: SecureKeyboard-V40-preaudit-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            audit-artifacts/**
          if-no-files-found: error
          retention-days: 14
