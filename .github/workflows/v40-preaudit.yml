name: SecureKeyboard V40 Pre-Audit

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  security-build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Static security audits
        run: |
          chmod +x scripts/*.sh
          ./scripts/security_audit.sh
          ./scripts/security_hardening_audit.sh
          ./scripts/crypto_key_management_audit.sh
          ./scripts/v40_audit.sh

      - name: JVM unit tests
        run: gradle --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off :app:assembleDebug

      - name: Assemble release APK (unsigned is expected unless CI signing secrets are configured)
        run: gradle --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off :app:assembleRelease

      - name: APK integrity report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \; | tee audit-artifacts/APK_SHA256.txt
          cp -f docs/security/V40_PRE_AUDIT_TEST_REPORT.md audit-artifacts/ 2>/dev/null || true
          cp -f docs/security/V40_SECURITY_AUDIT_READINESS.md audit-artifacts/ 2>/dev/null || true
          cp -f docs/security/V40_INTEGRITY_MANIFEST.sha256 audit-artifacts/ 2>/dev/null || true

      - name: Upload APKs and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: SecureKeyboard-V40-preaudit-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            audit-artifacts/**
          if-no-files-found: error
          retention-days: 14
