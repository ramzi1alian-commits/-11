org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Supply-chain hardening: this project ships with dependency LOCKING
# enabled (see build.gradle files) and expects a
# gradle/verification-metadata.xml to be present (see docs/security/
# SUPPLY_CHAIN.md for how to generate/regenerate it). Gradle refuses to
# build if a resolved artifact's checksum doesn't match what's recorded,
# which stops a compromised/rotated upstream artifact from being pulled
# in silently.
org.gradle.dependency.verification=strict
